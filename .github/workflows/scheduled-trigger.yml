name: Scheduled trigger

# Exists only because update.yml's own schedule trigger got stuck on
# GitHub's backend (confirmed: zero schedule-triggered runs of update.yml
# for 12+ hours across a cron-interval change and a remove/readd cycle,
# while workflow_dispatch kept firing reliably the whole time). A
# separate, freshly-created workflow file gets its own schedule
# registration -- if this one also goes silent, the problem is repo-wide
# rather than specific to update.yml, and needs a GitHub Support ticket
# or an external trigger instead.

on:
  schedule:
    - cron: "7,37 * * * *"  # every 30 minutes, offset from :00/:30
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch update.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --repo ${{ github.repository }}
