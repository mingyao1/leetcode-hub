name: Update and deploy

on:
  schedule:
    # Every 30 minutes, offset from :00/:30 -- GitHub documents the top
    # of every hour as its highest-congestion window for scheduled
    # workflows. In practice GitHub doesn't just delay runs under load,
    # it sometimes drops a scheduled slot entirely (observed twice in a
    # row on 2026-08-27 even at the 2-hour cadence with a dedicated
    # midnight run) -- there's no cron interval that fully guarantees a
    # run happens. Going tighter means a dropped slot self-heals within
    # ~30min instead of up to several hours, which is the actual goal.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["users.json", "public/index.html"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Fetch LeetCode data
        run: python scripts/fetch.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json cache/problems.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data [skip ci]"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
