name: Update and deploy

on:
  schedule:
    # Both offset from :00 -- GitHub documents the top of every hour as
    # its highest-congestion window for scheduled workflows, where runs
    # are most likely to be delayed or dropped entirely.
    - cron: "17 */2 * * *"  # routine: every 2 hours
    - cron: "5 4 * * *"     # guaranteed run just after US Eastern midnight
                             # (04:05 UTC ~ 12:05am EDT; drifts to ~11:05pm
                             # EST across the DST changeover, which is fine)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["users.json", "public/index.html"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Fetch LeetCode data
        run: python scripts/fetch.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json cache/problems.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data [skip ci]"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
