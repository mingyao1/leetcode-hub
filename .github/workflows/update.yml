name: Update and deploy

on:
  schedule:
    # Every 30 minutes, offset from :00/:30 to avoid GitHub's documented
    # top-of-hour congestion window. Re-added after briefly removing it
    # in the previous commit -- the schedule had gone completely silent
    # (zero fires in ~10hrs while workflow_dispatch/push kept working),
    # which community reports say removing-then-readding fixes by
    # forcing GitHub to re-register the trigger from scratch.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["users.json", "public/index.html"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Fetch LeetCode data
        run: python scripts/fetch.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json cache/problems.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data [skip ci]"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
