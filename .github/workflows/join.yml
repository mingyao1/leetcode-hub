name: Process join request

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  join:
    if: >
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'join-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Handle join request
        id: join
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python scripts/join_handler.py

      - name: Commit new user
        if: steps.join.outputs.status == 'success'
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add users.json
          git commit -m "Add $ISSUE_AUTHOR to users.json [skip ci]"
          git push

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file /tmp/join_comment.md

      - name: Close issue on success
        if: steps.join.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER"

      - name: Trigger update workflow
        if: steps.join.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml
